{% extends "base.html" %}
{% block title %}Demander un Devis{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>📝 Demander un Devis à {{ pro.name }}</h2>
    
    <div class="card mt-4">
        <div class="card-body">
            <h5>{{ pro.categorie }}</h5>
            <p><strong>Ville :</strong> {{ pro.localisation if pro.localisation else '-' }}</p>
        </div>
    </div>
    
    <form method="post" class="mt-4">
        <div class="mb-3">
            <label for="titre" class="form-label">Titre du devis *</label>
            <input type="text" class="form-control" id="titre" name="titre" required 
                   placeholder="Ex: Installation électrique complète">
        </div>
        
        <div class="mb-3">
            <label for="description" class="form-label">Description détaillée</label>
            <textarea class="form-control" id="description" name="description" rows="5"
                      placeholder="Décrivez précisément ce dont vous avez besoin..."></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary">📤 Envoyer la demande</button>
        <a href="{{ url_for('profil', pro_id=pro.id) }}" class="btn btn-secondary">Retour</a>
    </form>
</div>
{% endblock %}
